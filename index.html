let currentQuiz = null;
let score = 0;
let answered = [];
let currentRankName = '';
let currentQuizType = '';
let totalQuestions = 0;
let currentExamType = 'multiple_choice';

function initializeExamTypeSelector(rankName, quizType) {
  currentRankName = rankName;
  currentQuizType = quizType;
  
  document.getElementById('exam-type-selector').classList.remove('hidden');
  document.getElementById('question-selector').classList.add('hidden');
  document.getElementById('exam-header').classList.add('hidden');
  document.getElementById('exam-questions').innerHTML = '';
  document.getElementById('exam-score').classList.add('hidden');
  document.getElementById('type-selector-title').textContent = `${rankName} - اختر نمط الاختبار`;
  lucide.createIcons();
}

function selectExamType(type) {
  currentExamType = type;
  
  document.getElementById('exam-type-selector').classList.add('hidden');
  document.getElementById('question-selector').classList.remove('hidden');
  document.getElementById('selector-title').textContent = `${currentRankName} - ${getExamPattern(type)}`;
  lucide.createIcons();
}

function getExamPattern(type) {
  const patterns = {
    'multiple_choice': 'اختيار من متعدد',
    'true_false': 'صح أم خطأ',
    'fill_blank': 'إكمال الفراغات',
    'matching': 'الربط/المطابقة'
  };
  return patterns[type] || 'اختبار';
}

function backToTypeSelection() {
  document.getElementById('exam-type-selector').classList.remove('hidden');
  document.getElementById('question-selector').classList.add('hidden');
  lucide.createIcons();
}

function startExamWithCount(count) {
  let rankData = mcqBank[currentQuizType];
  
  // Fallback: if no dedicated questions exist for this rank, use regulations questions
  if (!rankData) {
    rankData = mcqBank['regulations'];
  }
  
  const questionsBank = (rankData && rankData[currentExamType]) || [];
  
  if (questionsBank.length === 0) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'p-4 bg-red-50 border border-red-300 rounded-lg text-red-700 text-center';
    errorDiv.textContent = 'لا توجد أسئلة متاحة لهذا النمط حالياً. جرّب نمط اختبار آخر.';
    document.getElementById('exam-questions').innerHTML = '';
    document.getElementById('exam-questions').appendChild(errorDiv);
    return;
  }
  
  const shuffled = [...questionsBank].sort(() => Math.random() - 0.5);
  currentQuiz = shuffled.slice(0, Math.min(count, questionsBank.length));
  
  totalQuestions = currentQuiz.length;
  score = 0;
  answered = new Array(totalQuestions).fill(false);
  
  document.getElementById('question-selector').classList.add('hidden');
  document.getElementById('exam-header').classList.remove('hidden');
  document.getElementById('exam-title').textContent = `اختبار: ${currentRankName} - ${getExamPattern(currentExamType)}`;
  document.getElementById('question-info').textContent = `السؤال 1 من ${totalQuestions}`;
  document.getElementById('exam-score').classList.add('hidden');
  document.getElementById('progress-bar').style.width = '0%';
  
  renderExamQuestions();
}

function renderExamQuestions() {
  const container = document.getElementById('exam-questions');
  let html = '';
  
  if (currentExamType === 'multiple_choice') {
    currentQuiz.forEach((q, qi) => {
      const isAnswered = answered[qi];
      let questionHTML = `<div class="bg-slate-50 rounded-xl p-5 border-2 border-slate-200 fade-in" id="q-${qi}">
        <div class="flex items-start gap-3 mb-3">
          <div class="question-counter">${qi + 1}</div>
          <p class="font-bold text-slate-800">${q.q}</p>
        </div>
        <div class="space-y-2">`;
      
      q.options.forEach((opt, oi) => {
        questionHTML += `<button onclick="checkAnswerMultipleChoice(${qi},${oi})" id="opt-${qi}-${oi}" class="w-full text-right p-3 border-2 border-slate-300 rounded-lg hover:border-indigo-500 hover:bg-indigo-50 transition-all text-sm option-btn" ${isAnswered ? 'disabled' : ''}>
          <span class="font-semibold text-[#818cf8] ml-2">${['أ','ب','ج','د','هـ','و'][oi] || (oi+1)}.</span> ${opt}
        </button>`;
      });
      
      questionHTML += `</div><div id="feedback-${qi}" class="mt-3 hidden"></div></div>`;
      html += questionHTML;
    });
  } else if (currentExamType === 'true_false') {
    currentQuiz.forEach((q, qi) => {
      const isAnswered = answered[qi];
      let questionHTML = `<div class="bg-slate-50 rounded-xl p-5 border-2 border-slate-200 fade-in" id="q-${qi}">
        <div class="flex items-start gap-3 mb-3">
          <div class="question-counter">${qi + 1}</div>
          <p class="font-bold text-slate-800">${q.q}</p>
        </div>
        <div class="flex gap-3">
          <button onclick="checkAnswerTrueFalse(${qi}, true)" id="opt-${qi}-0" class="flex-1 p-3 border-2 border-slate-300 bg-white rounded-lg hover:border-green-500 hover:bg-green-50 transition-all text-sm font-semibold option-btn" ${isAnswered ? 'disabled' : ''}>✓ صح</button>
          <button onclick="checkAnswerTrueFalse(${qi}, false)" id="opt-${qi}-1" class="flex-1 p-3 border-2 border-slate-300 bg-white rounded-lg hover:border-red-500 hover:bg-red-50 transition-all text-sm font-semibold option-btn" ${isAnswered ? 'disabled' : ''}>✗ خطأ</button>
        </div>
        <div id="feedback-${qi}" class="mt-3 hidden"></div>
      </div>`;
      html += questionHTML;
    });
  } else if (currentExamType === 'fill_blank') {
    currentQuiz.forEach((q, qi) => {
      const isAnswered = answered[qi];
      let questionHTML = `<div class="bg-slate-50 rounded-xl p-5 border-2 border-slate-200 fade-in" id="q-${qi}">
        <div class="flex items-start gap-3 mb-3">
          <div class="question-counter">${qi + 1}</div>
          <p class="font-bold text-slate-800">${q.q}</p>
        </div>
        <input type="text" id="answer-${qi}" class="w-full p-3 border-2 border-slate-300 rounded-lg text-right placeholder-shown:text-right" placeholder="اكتب الإجابة هنا..." ${isAnswered ? 'disabled' : ''}>
        <button onclick="checkAnswerFillBlank(${qi})" id="submit-${qi}" class="w-full mt-3 p-3 text-white rounded-lg font-semibold transition option-btn btn-3d" style="background: linear-gradient(135deg,#dc2626,#b91c1c); box-shadow: 0 4px 8px rgba(220,38,38,0.3);" ${isAnswered ? 'hidden' : ''}>تأكيد</button>
        <div id="feedback-${qi}" class="mt-3 hidden"></div>
      </div>`;
      html += questionHTML;
    });
  } else if (currentExamType === 'matching') {
    currentQuiz.forEach((q, qi) => {
      const isAnswered = answered[qi];
      let questionHTML = `<div class="bg-slate-50 rounded-xl p-5 border-2 border-slate-200 fade-in" id="q-${qi}">
        <div class="flex items-start gap-3 mb-3">
          <div class="question-counter">${qi + 1}</div>
          <p class="font-bold text-slate-800">${q.q}</p>
        </div>
        <div class="space-y-2">`;
      
      q.pairs.forEach((pair, pi) => {
        questionHTML += `<div class="flex gap-2 items-center">
          <div class="flex-1 p-3 bg-white border-2 border-slate-300 rounded-lg text-sm text-right font-semibold">${pair.left}</div>
          <span class="text-xl text-slate-400">⟷</span>
          <select id="match-${qi}-${pi}" class="flex-1 p-3 border-2 border-slate-300 rounded-lg text-right text-sm" ${isAnswered ? 'disabled' : ''}>
            <option value="">اختر...</option>
            ${q.pairs.map((p, i) => `<option value="${i}">${p.right}</option>`).join('')}
          </select>
        </div>`;
      });
      
      questionHTML += `</div>
        <button onclick="checkAnswerMatching(${qi})" id="submit-${qi}" class="w-full mt-3 p-3 text-white rounded-lg font-semibold transition option-btn btn-3d" style="background: linear-gradient(135deg,#22c55e,#15803d); box-shadow: 0 4px 8px rgba(34,197,94,0.3);" ${isAnswered ? 'hidden' : ''}>تأكيد</button>
        <div id="feedback-${qi}" class="mt-3 hidden"></div>
      </div>`;
      html += questionHTML;
    });
  }
  
  container.innerHTML = html;
  lucide.createIcons();
}

function checkAnswerMultipleChoice(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;
  const q = currentQuiz[qi];
  const isCorrect = oi === q.correct;
  if (isCorrect) score++;
  
  updateProgress();
  
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;
    btn.classList.remove('hover:border-[#2d5a87]', 'hover:bg-slate-100');
    if (i === q.correct) btn.className = 'w-full text-right p-3 border-2 rounded-lg text-sm correct-answer border-emerald-500 option-btn';
    else if (i === oi && !isCorrect) btn.className = 'w-full text-right p-3 border-2 rounded-lg text-sm wrong-answer border-red-400 option-btn';
  });
  
  showFeedback(qi, isCorrect, q.explanation);
}

function checkAnswerTrueFalse(qi, answer) {
  if (answered[qi]) return;
  answered[qi] = true;
  const q = currentQuiz[qi];
  const isCorrect = answer === q.correct;
  if (isCorrect) score++;
  
  updateProgress();
  
  const btn1 = document.getElementById(`opt-${qi}-0`);
  const btn2 = document.getElementById(`opt-${qi}-1`);
  btn1.disabled = btn2.disabled = true;
  
  if (answer === true && q.correct === true) btn1.className = 'flex-1 p-3 border-2 border-emerald-500 bg-emerald-50 rounded-lg text-sm font-semibold correct-answer option-btn';
  else if (answer === true) btn1.className = 'flex-1 p-3 border-2 border-red-400 bg-red-50 rounded-lg text-sm font-semibold wrong-answer option-btn';
  
  if (answer === false && q.correct === false) btn2.className = 'flex-1 p-3 border-2 border-emerald-500 bg-emerald-50 rounded-lg text-sm font-semibold correct-answer option-btn';
  else if (answer === false) btn2.className = 'flex-1 p-3 border-2 border-red-400 bg-red-50 rounded-lg text-sm font-semibold wrong-answer option-btn';
  
  showFeedback(qi, isCorrect, q.explanation);
}

function checkAnswerFillBlank(qi) {
  if (answered[qi]) return;
  const q = currentQuiz[qi];
  const userAnswer = document.getElementById(`answer-${qi}`).value.trim().normalize('NFC');
  const correctAnswer = q.correct_answer.trim().normalize('NFC');
  const isCorrect = userAnswer === correctAnswer || userAnswer.replace(/\s+/g,'') === correctAnswer.replace(/\s+/g,'');
  
  if (isCorrect) score++;
  answered[qi] = true;
  updateProgress();
  
  document.getElementById(`answer-${qi}`).disabled = true;
  document.getElementById(`submit-${qi}`).hidden = true;
  
  showFeedback(qi, isCorrect, q.explanation);
}

function checkAnswerMatching(qi) {
  if (answered[qi]) return;
  const q = currentQuiz[qi];
  let isCorrect = true;
  
  for (let i = 0; i < q.pairs.length; i++) {
    const selected = document.getElementById(`match-${qi}-${i}`).value;
    if (selected === '') isCorrect = false;
    if (parseInt(selected) !== i) isCorrect = false;
    document.getElementById(`match-${qi}-${i}`).disabled = true;
  }
  
  if (isCorrect) score++;
  answered[qi] = true;
  updateProgress();
  
  document.getElementById(`submit-${qi}`).hidden = true;
  
  showFeedback(qi, isCorrect, q.explanation);
}

function updateProgress() {
  const answeredCount = answered.filter(a => a).length;
  const progress = (answeredCount / totalQuestions) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
  document.getElementById('question-info').textContent = `السؤال ${answeredCount} من ${totalQuestions}`;
  
  if (answered.every(a => a)) {
    const scoreCard = document.getElementById('exam-score');
    scoreCard.classList.remove('hidden');
    const percentage = (score / totalQuestions) * 100;
    document.getElementById('final-score').textContent = `${percentage.toFixed(0)}% - ${score} من ${totalQuestions}`;
    
    if (percentage >= 80) document.getElementById('score-message').textContent = '🎉 ممتاز! أداء استثنائي';
    else if (percentage >= 60) document.getElementById('score-message').textContent = '👍 جيد جداً! استمر في التحضير';
    else if (percentage >= 40) document.getElementById('score-message').textContent = '📚 جيد! راجع المواضيع الضعيفة';
    else document.getElementById('score-message').textContent = '⚠️ تحتاج لمراجعة أكثر. شغل على المواد الأساسية';
  }
}

function showFeedback(qi, isCorrect, explanation) {
  const feedback = document.getElementById(`feedback-${qi}`);
  feedback.classList.remove('hidden');
  feedback.innerHTML = `<div class="p-3 rounded-lg ${isCorrect ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
    <p class="font-semibold text-sm ${isCorrect ? 'text-emerald-700' : 'text-red-700'}">${isCorrect ? '✓ إجابة صحيحة!' : '✗ إجابة خاطئة'}</p>
    <p class="text-sm text-slate-600 mt-1">${explanation}</p>
  </div>`;
}

function selectRank(rankName) {
  let quizType = 'teaching_primary';
  
  // First check more specific conditions before general ones
  if (rankName.includes('مستشار التربية') && !rankName.includes('توجيه')) quizType = 'education_counselors';
  else if (rankName.includes('ناظر')) quizType = 'principals';
  else if (rankName.includes('مساعد التربية') || rankName.includes('مساعد رئيسي')) quizType = 'education_assistants';
  else if (rankName.includes('توجيه') || rankName.includes('إرشاد')) quizType = 'guidance';
  else if (rankName.includes('مشرف')) quizType = 'education_supervisors';
  else if (rankName.includes('متخصص') || rankName.includes('مربي')) quizType = 'specialized_educators';
  else if (rankName.includes('مخابر')) quizType = 'labs';
  else if (rankName.includes('تغذية')) quizType = 'nutrition';
  else if (rankName.includes('مصالح الاقتصادية')) quizType = 'economic_assistants';
  else if (rankName.includes('نائب مقتصد')) quizType = 'deputy_comptrollers';
  else if (rankName.includes('مقتصد')) quizType = 'comptrollers';
  else if (rankName.includes('مدير المدرسة الابتدائية')) quizType = 'primary_schools_directors';
  else if (rankName.includes('مدير المدرسة المتوسطة')) quizType = 'middle_schools_directors';
  else if (rankName.includes('مدير المدرسة الثانوية')) quizType = 'high_schools_directors';
  else if (rankName.includes('مفتش التعليم الابتدائي')) quizType = 'primary_inspectors';
  else if (rankName.includes('مفتش التعليم المتوسط')) quizType = 'middle_inspectors';
  else if (rankName.includes('مفتش التعليم الثانوي')) quizType = 'secondary_inspectors';
  else if (rankName.includes('مفتش التربية')) quizType = 'education_inspectors';
  else if (rankName.includes('تكنولوجيا')) quizType = 'ict';
  else if (rankName.includes('علوم التربية') || rankName.includes('البيداغوجيا')) quizType = 'education_sciences';
  else if (rankName.includes('ثانوي')) quizType = 'teaching_secondary';
  else if (rankName.includes('متوسط')) quizType = 'teaching_middle';
  
  switchTab('exam');
  initializeExamTypeSelector(rankName, quizType);
}

function switchTab(tab) {
  document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
  document.querySelectorAll('[id^="tab-"]').forEach(t => { t.className = 'px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap text-slate-300 hover:bg-white/10 transition-all flex items-center gap-2 btn-3d'; });
  document.getElementById('section-' + tab).classList.remove('hidden');
  document.getElementById('tab-' + tab).className = 'tab-active px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition-all flex items-center gap-2 btn-3d';
  if (tab === 'ranks') renderRanks();
  lucide.createIcons();
}

};

      document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
    },
    mapToCapabilities: (config) => ({
      recolorables: [],
      borderables: [],

    }),
